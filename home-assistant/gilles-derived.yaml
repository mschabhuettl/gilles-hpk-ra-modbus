# Gilles -- Abgeleitete Sensoren (Tier 1 + Tier 2)
# =====================================================================
# Berechnete Sensoren, Zähler, History-Statistiken und Effizienz-Werte.
# Komplett unabhängig von modbus.yaml -- die Modbus-Sensoren bleiben
# wie sie sind, hier werden nur zusätzliche Informationen abgeleitet.
#
# Einbau:
#   1. Datei ins HA-Konfig-Verzeichnis unter packages/gilles-derived.yaml
#   2. In configuration.yaml EINMAL einfügen (falls noch nicht da):
#        homeassistant:
#          packages: !include_dir_named packages
#   3. HA neu starten
#
# Voraussetzung: modbus.yaml muss bereits eingebunden und funktionsfähig
# sein (die Entitäten sensor.gilles_* werden hier verwendet).

# =====================================================================
# COUNTER -- Zähler für Brennstarts und Ascheaustragungen
# =====================================================================
counter:
  gilles_brennstarts_total:
    name: Gilles Brennstarts gesamt
    icon: mdi:fire
    step: 1
    initial: 0
    restore: true
  gilles_ascheaustragungen_total:
    name: Gilles Ascheaustragungen gesamt
    icon: mdi:trash-can-outline
    step: 1
    initial: 0
    restore: true

# =====================================================================
# UTILITY_METER -- Tägliche / Wöchentliche / Monatliche Aggregation
# =====================================================================
utility_meter:
  gilles_brennstarts_heute:
    name: Brennstarts heute
    source: counter.gilles_brennstarts_total
    cycle: daily
  gilles_brennstarts_woche:
    name: Brennstarts diese Woche
    source: counter.gilles_brennstarts_total
    cycle: weekly
  gilles_brennstarts_monat:
    name: Brennstarts diesen Monat
    source: counter.gilles_brennstarts_total
    cycle: monthly
  gilles_ascheaustragungen_heute:
    name: Ascheaustragungen heute
    source: counter.gilles_ascheaustragungen_total
    cycle: daily
  gilles_pellet_verbrauch_heute:
    name: Pelletverbrauch heute
    source: sensor.gilles_pellet_verbrauch_kumuliert
    cycle: daily
  gilles_pellet_verbrauch_monat:
    name: Pelletverbrauch diesen Monat
    source: sensor.gilles_pellet_verbrauch_kumuliert
    cycle: monthly

# =====================================================================
# AUTOMATIONS -- Counter-Trigger
# =====================================================================
automation:
  - id: gilles_count_brennstart
    alias: "Gilles: Brennstart zählen"
    description: Inkrementiert Brennstart-Counter wenn BrennPhase von 0 auf 1 wechselt
    trigger:
      - platform: state
        entity_id: sensor.gilles_brenn_phase_code
        from: "0"
        to: "1"
    action:
      - service: counter.increment
        target:
          entity_id: counter.gilles_brennstarts_total
    mode: single

  - id: gilles_count_ascheaustragung
    alias: "Gilles: Ascheaustragung zählen"
    description: Inkrementiert bei jedem Ascheaustragungs-Start
    trigger:
      - platform: state
        entity_id: binary_sensor.gilles_ascheaustragung_lauft
        from: "off"
        to: "on"
    action:
      - service: counter.increment
        target:
          entity_id: counter.gilles_ascheaustragungen_total
    mode: single

# =====================================================================
# TEMPLATE SENSORS -- Berechnete Werte
# =====================================================================
template:
  # ---------------------------------------------------------------------
  # TIER 1 -- Trigger-basiert (Zeitstempel)
  # ---------------------------------------------------------------------

  # Zeitpunkt des letzten Brennstarts
  - trigger:
      - platform: state
        entity_id: sensor.gilles_brenn_phase_code
        from: "0"
        to: "1"
    sensor:
      - name: "Gilles Brennstart Letzter"
        unique_id: gilles_brennstart_letzter
        state: "{{ now().isoformat() }}"
        device_class: timestamp
        icon: mdi:clock-start

  # Zeitpunkt des Brennzyklus-Endes (BrennPhase wechselt auf 0 oder 9)
  - trigger:
      - platform: state
        entity_id: sensor.gilles_brenn_phase_code
        to: "0"
    sensor:
      - name: "Gilles Brennende Letztes"
        unique_id: gilles_brennende_letztes
        state: "{{ now().isoformat() }}"
        device_class: timestamp
        icon: mdi:clock-end

  # Dauer des letzten Brennzyklus (wird beim Zyklus-Ende berechnet)
  - trigger:
      - platform: state
        entity_id: sensor.gilles_brenn_phase_code
        to: "0"
        for: "00:00:30"
    sensor:
      - name: "Gilles Letzter Brennzyklus Dauer"
        unique_id: gilles_letzter_brennzyklus_dauer
        state: >
          {% set start = states('sensor.gilles_brennstart_letzter') %}
          {% if start not in ['unknown', 'unavailable', 'none', None] %}
            {{ ((now() - as_datetime(start)).total_seconds() / 60) | round(1) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "min"
        icon: mdi:timer-sand

  # Zeitpunkt des aktuellen Phasenbeginns
  - trigger:
      - platform: state
        entity_id: sensor.gilles_brenn_phase_code
    sensor:
      - name: "Gilles Phase Beginn"
        unique_id: gilles_phase_beginn
        state: "{{ now().isoformat() }}"
        device_class: timestamp
        icon: mdi:clock-outline

  # ---------------------------------------------------------------------
  # TIER 1 -- Standard-Templates (continuously evaluated)
  # ---------------------------------------------------------------------
  - sensor:
      # Vor-/Rücklauf-Spreizung
      - name: "Gilles Spreizung"
        unique_id: gilles_spreizung
        state: >
          {% set k = states('sensor.gilles_kesseltemperatur') | float(0) %}
          {% set r = states('sensor.gilles_rucklauftemperatur') | float(0) %}
          {{ (k - r) | round(1) }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-lines

      # Dauer in aktueller Phase (in Minuten)
      - name: "Gilles Phase Dauer"
        unique_id: gilles_phase_dauer
        state: >
          {% set start = states('sensor.gilles_phase_beginn') %}
          {% if start not in ['unknown', 'unavailable', 'none', None] %}
            {{ ((now() - as_datetime(start)).total_seconds() / 60) | round(1) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "min"
        icon: mdi:timer-outline
        availability: "{{ states('sensor.gilles_phase_beginn') not in ['unknown', 'unavailable'] }}"

      # Zeit seit letztem Brennstart (Minuten)
      - name: "Gilles Zeit Seit Brennstart"
        unique_id: gilles_zeit_seit_brennstart
        state: >
          {% set start = states('sensor.gilles_brennstart_letzter') %}
          {% if start not in ['unknown', 'unavailable', 'none', None] %}
            {{ ((now() - as_datetime(start)).total_seconds() / 60) | round(0) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "min"
        icon: mdi:fire-circle

      # Zeit seit letzter Ascheaustragung (Minuten)
      - name: "Gilles Zeit Seit Aschenaustragung"
        unique_id: gilles_zeit_seit_aschenaustragung
        state: >
          {% set last = states.binary_sensor.gilles_ascheaustragung_lauft.last_changed %}
          {% if last %}
            {{ ((now() - last).total_seconds() / 60) | round(0) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "min"
        icon: mdi:timer-sand-complete

      # ---------------------------------------------------------------
      # TIER 2 -- Effizienz nach Siegert-Formel
      # ---------------------------------------------------------------
      # Rauchgasverlust (qA) -- Siegert-Formel für Pellets:
      #   qA = (T_Abgas - T_Raum) * (A2 / CO2 + B)
      #   mit A2=0.65, B=0.011 für Biomasse (Pellets)
      #   CO2 [%] geschätzt aus O2: CO2 ≈ 20.6 * (1 - O2/21)
      # Annahme: Raumtemperatur 20°C (Heizraum)
      # Liefert 0 wenn Brenner inaktiv (Abgas < 60°C oder O2 ≥ 20%)
      - name: "Gilles Rauchgasverlust"
        unique_id: gilles_rauchgasverlust
        state: >
          {% set t_abgas = states('sensor.gilles_abgastemperatur') | float(0) %}
          {% set t_raum = 20 %}
          {% set o2 = states('sensor.gilles_o2_ist') | float(21) %}
          {% if t_abgas > 60 and o2 < 20 and o2 > 0 %}
            {% set co2 = 20.6 * (1 - o2 / 21) %}
            {% if co2 > 0 %}
              {{ ((t_abgas - t_raum) * (0.65 / co2 + 0.011)) | round(1) }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge-low

      # Feuerungstechnischer Wirkungsgrad
      - name: "Gilles Wirkungsgrad"
        unique_id: gilles_wirkungsgrad
        state: >
          {% set qa = states('sensor.gilles_rauchgasverlust') | float(0) %}
          {% if qa > 0 %}
            {{ (100 - qa) | round(1) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:gauge

      # Modulationsgrad anhand Primärluft (0%=Min, 100%=Max)
      - name: "Gilles Modulationsgrad"
        unique_id: gilles_modulationsgrad
        state: >
          {% set ist = states('sensor.gilles_primaer_ist') | float(0) %}
          {% set mn = states('sensor.gilles_primaer_min') | float(0) %}
          {% set mx = states('sensor.gilles_primaer_max') | float(0) %}
          {% if mx > mn and ist > 0 %}
            {{ ((ist - mn) / (mx - mn) * 100) | round(0) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:speedometer

      # Aktueller Pelletfluss (kg/h, sehr grobe Schätzung!)
      # Annahme: 100% Förderschnecke = ca. 3.5 kg/h Pellets
      # Nur aktiv in Anbrenn- und Heizphase (BrennPhase 6 oder 7)
      - name: "Gilles Pellet Fluss aktuell"
        unique_id: gilles_pellet_fluss_aktuell
        state: >
          {% set phase = states('sensor.gilles_brenn_phase_code') | int(0) %}
          {% set soll = states('sensor.gilles_forderschnecke_soll') | float(0) %}
          {% if phase in [6, 7] %}
            {{ (soll / 100 * 3.5) | round(3) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "kg/h"
        state_class: measurement
        icon: mdi:grain

# =====================================================================
# SENSOR -- Integration / Statistics / History-Stats
# =====================================================================
sensor:
  # Kumulierter Pelletverbrauch -- Integral des Pellet-Flusses
  - platform: integration
    source: sensor.gilles_pellet_fluss_aktuell
    name: "Gilles Pellet Verbrauch kumuliert"
    unique_id: gilles_pellet_verbrauch_kumuliert
    unit_prefix: ""
    unit_time: h
    method: left
    round: 3

  # --- Statistik: Min/Max/Mean über 24h ---
  - platform: statistics
    name: "Gilles Kessel 24h Min"
    unique_id: gilles_kessel_24h_min
    entity_id: sensor.gilles_kesseltemperatur
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 2880   # alle 30 sec = 2880 pro 24h

  - platform: statistics
    name: "Gilles Kessel 24h Max"
    unique_id: gilles_kessel_24h_max
    entity_id: sensor.gilles_kesseltemperatur
    state_characteristic: value_max
    max_age:
      hours: 24
    sampling_size: 2880

  - platform: statistics
    name: "Gilles Abgas 24h Max"
    unique_id: gilles_abgas_24h_max
    entity_id: sensor.gilles_abgastemperatur
    state_characteristic: value_max
    max_age:
      hours: 24
    sampling_size: 2880

  - platform: statistics
    name: "Gilles O2 24h Min"
    unique_id: gilles_o2_24h_min
    entity_id: sensor.gilles_o2_ist
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 2880

  - platform: statistics
    name: "Gilles Wirkungsgrad 24h Mean"
    unique_id: gilles_wirkungsgrad_24h_mean
    entity_id: sensor.gilles_wirkungsgrad
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 1000

  # --- Statistik: durchschnittliche Phasendauern (über 7 Tage) ---
  # Anzahl der Brennstarts in 7 Tagen
  - platform: statistics
    name: "Gilles Brennstarts 7d Anzahl"
    unique_id: gilles_brennstarts_7d_anzahl
    entity_id: counter.gilles_brennstarts_total
    state_characteristic: change
    max_age:
      days: 7
    sampling_size: 1000

  # --- History-Stats: kumulative Zeiten ---
  - platform: history_stats
    name: "Gilles Brennzeit heute"
    unique_id: gilles_brennzeit_heute
    entity_id: binary_sensor.gilles_brenner_aktiv
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Gilles Brennzeit 7d"
    unique_id: gilles_brennzeit_7d
    entity_id: binary_sensor.gilles_brenner_aktiv
    state: "on"
    type: time
    end: "{{ now() }}"
    duration:
      days: 7

  - platform: history_stats
    name: "Gilles Tuer offen heute Dauer"
    unique_id: gilles_tuer_offen_heute_dauer
    entity_id: binary_sensor.gilles_brennraumtur
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Gilles Tuer offen heute Anzahl"
    unique_id: gilles_tuer_offen_heute_anzahl
    entity_id: binary_sensor.gilles_brennraumtur
    state: "on"
    type: count
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

  # Phase-Dauer-Statistiken (über 7 Tage) -- helfen REG[68/56/72] zu deuten
  - platform: history_stats
    name: "Gilles Heizphase Dauer 7d"
    unique_id: gilles_heizphase_dauer_7d
    entity_id: sensor.gilles_brenn_phase
    state: "Heizen regeln"
    type: time
    end: "{{ now() }}"
    duration:
      days: 7

  - platform: history_stats
    name: "Gilles Zuendphase Dauer 7d"
    unique_id: gilles_zuendphase_dauer_7d
    entity_id: sensor.gilles_brenn_phase
    state: "Zuendung"
    type: time
    end: "{{ now() }}"
    duration:
      days: 7
