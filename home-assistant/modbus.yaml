# =====================================================================
# Template sensors -- plain-text translations for enums and bitmaps
# =====================================================================
template:
  - sensor:
      # Burner phase as plain text
      - name: "Gilles Brenn Phase"
        unique_id: gilles_brenn_phase_text
        state: >
          {% set codes = {
            0: 'Standby',
            1: 'Vorlueften',
            3: 'Zuendung',
            5: 'Zuendung-Spaet',
            6: 'Anbrennphase',
            7: 'Heizen regeln',
            8: 'Ausbrennen',
            9: 'Auskuehlen'
          } %}
          {{ codes.get(states('sensor.gilles_brenn_phase_code') | int(0),
             'Unbekannt (Code ' ~ states('sensor.gilles_brenn_phase_code') ~ ')') }}
        icon: >
          {% set p = states('sensor.gilles_brenn_phase_code') | int(0) %}
          {% if p == 0 %}mdi:power-standby
          {% elif p in [1,3,5,6] %}mdi:fire
          {% elif p == 7 %}mdi:fire
          {% elif p == 8 %}mdi:fire-alert
          {% elif p == 9 %}mdi:snowflake-melt
          {% else %}mdi:help-circle
          {% endif %}

      # Boiler mode as plain text
      - name: "Gilles Boiler Status"
        unique_id: gilles_boiler_status_text
        state: >
          {% set codes = {
            1: 'Handbetrieb',
            3: 'Puffer/Boiler',
            5: 'Automatik'
          } %}
          {{ codes.get(states('sensor.gilles_boiler_status_code') | int(0),
             'Unbekannt (Code ' ~ states('sensor.gilles_boiler_status_code') ~ ')') }}
        icon: >
          {% set s = states('sensor.gilles_boiler_status_code') | int(0) %}
          {% if s == 1 %}mdi:hand-back-right
          {% elif s == 3 %}mdi:water-boiler
          {% elif s == 5 %}mdi:cog
          {% else %}mdi:state-machine
          {% endif %}

      # Status bitmap as plain text
      - name: "Gilles Anlagen-Zustand"
        unique_id: gilles_anlagen_zustand
        state: >
          {% set codes = {
            0: 'Normal',
            35: 'Brennraumtuer offen',
            61: 'Puffer/Boiler-Modus aktiv'
          } %}
          {{ codes.get(states('sensor.gilles_status_bitmap') | int(0),
             'Code ' ~ states('sensor.gilles_status_bitmap')) }}
        icon: mdi:alert-circle-outline

      # Day/Night derived from KesselSoll_Live vs Tag/Nacht setpoints
      - name: "Gilles Zeitprofil"
        unique_id: gilles_zeitprofil
        state: >
          {% set live = states('sensor.gilles_kessel_soll_live') | float(0) %}
          {% set tag = states('sensor.gilles_kessel_soll_tag') | float(0) %}
          {% set nacht = states('sensor.gilles_kessel_soll_nacht') | float(0) %}
          {% if live == 0 %}
            inaktiv
          {% elif live == tag %}
            Tag
          {% elif live == nacht %}
            Nacht
          {% elif live == 80.0 %}
            Puffer-Lade-Soll
          {% else %}
            Sonderwert ({{ live }}°C)
          {% endif %}
        icon: >
          {% set p = states('sensor.gilles_zeitprofil') %}
          {% if p == 'Tag' %}mdi:weather-sunny
          {% elif p == 'Nacht' %}mdi:weather-night
          {% elif p == 'Puffer-Lade-Soll' %}mdi:water-boiler
          {% else %}mdi:help-circle
          {% endif %}

  - binary_sensor:
      # CORRECTED in v0.3.0: Door is detected via StatusBitmap=35, not REG[62]
      - name: "Gilles Brennraumtuer"
        unique_id: gilles_brennraumtuer
        state: "{{ states('sensor.gilles_status_bitmap') | int(0) == 35 }}"
        device_class: door
        icon: mdi:door

      # Ash discharge currently active
      - name: "Gilles Ascheaustragung laeuft"
        unique_id: gilles_ascheaustragung_laeuft
        state: "{{ states('sensor.gilles_ascheaustragung_aktiv') | int(0) > 0 }}"
        icon: mdi:trash-can-outline

      # Burner active heuristic: phase > 0 OR exhaust > 60°C
      - name: "Gilles Brenner aktiv"
        unique_id: gilles_brenner_aktiv
        state: >
          {{ states('sensor.gilles_brenn_phase_code') | int(0) > 0
             or states('sensor.gilles_abgastemperatur') | float(0) > 60
             or states('sensor.gilles_primaer_ist') | float(0) > 0
             or states('sensor.gilles_saugzug_ist') | float(0) > 0 }}
        device_class: heat
        icon: mdi:fire
