# Gilles Touch -- Home Assistant Modbus Integration v0.3.0
# ---------------------------------------------------------
# Status: 29/40 registers verified (+ 4 strongly suspected).
# See https://github.com/mschabhuettl/gilles-hpk-ra-modbus for details.
#
# Drop into configuration.yaml or include via packages.
# CHANGE the `host` IP to your boiler's IP address.
#
# BREAKING CHANGE in v0.3.0:
#   - "Brennraumtuer Raw" sensor (REG[62]) renamed to "Saugzug Ist"
#     because REG[62] is actually the induced draft fan percentage,
#     not the door state. The door is only visible via REG[46]=35.

modbus:
  - name: gilles
    type: tcp
    host: 192.0.2.1              # CHANGE TO YOUR BOILER IP (RFC5737 placeholder)
    port: 502
    delay: 2
    timeout: 5
    retries: 1                    # IMPORTANT: Sigmatek dislikes the pymodbus default of 3

    sensors:
      # === Setpoints / Parameters (rarely changed, slow polling) ===

      - name: "Gilles Foerderschnecke Soll"
        unique_id: gilles_foerderschnecke_soll
        slave: 1
        address: 0
        input_type: holding
        data_type: int32
        scale: 0.1
        precision: 1
        unit_of_measurement: "%"
        scan_interval: 300

      - name: "Gilles Primaer Max"
        unique_id: gilles_primaer_max
        slave: 1
        address: 2
        input_type: holding
        data_type: int32
        scale: 0.1
        precision: 1
        unit_of_measurement: "%"
        scan_interval: 300

      - name: "Gilles Primaer Min"
        unique_id: gilles_primaer_min
        slave: 1
        address: 4
        input_type: holding
        data_type: int32
        scale: 0.1
        precision: 1
        unit_of_measurement: "%"
        scan_interval: 300

      - name: "Gilles Sekundaer Max"
        unique_id: gilles_sekundaer_max
        slave: 1
        address: 6
        input_type: holding
        data_type: int32
        scale: 0.1
        precision: 1
        unit_of_measurement: "%"
        scan_interval: 300

      - name: "Gilles Sekundaer Min"
