- cards:
  - content: '## Erfasster Betrieb


      Start- und Aschezähler erfassen Ereignisse seit **7. September 2026**. Der erste Tag, die erste Woche und der erste
      Monat sind deshalb unvollständig. Messlücken werden nicht aufgefüllt. Pelletverbrauch und Wirkungsgrad benötigen zusätzliche
      Messdaten und Kalibrierung.'
    type: markdown
