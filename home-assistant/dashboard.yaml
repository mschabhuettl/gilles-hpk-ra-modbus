  - content: 'Die Startdiagnose gilt nur für direkt beobachtete Starts von 0 auf 1 bei 40 numerisch verfügbaren
      Rohwerten. Neustart, Standby oder Ausfall eines Rohwerts verwerfen die laufende Diagnose. Wiederkehr
      der Daten genügt nicht; erst ein neuer Start aktiviert sie.


      Die Startphase schließt Vorlüften ein. Nach mehr als 30 Minuten vergleicht der Temperaturhinweis im Anbrenn-
      oder Heizbetrieb mit der niedrigsten gültigen Kesseltemperatur seit dem Start. Die ursprüngliche Starttemperatur
      bleibt getrennt erhalten. Der Hinweis schaltet erst ein, wenn Anstieg und geglättete Heizrate fünf Minuten
      lang unter den Diagnoseschwellen liegen. Die Heizrate muss zum Einschalten unter Mindestanstieg / 30
      Minuten liegen; ein aktiver Hinweis wird bei mindestens Mindestanstieg / 20 Minuten zurückgenommen. Ein
      ausreichender Temperaturanstieg oder das Ende der Diagnose schaltet den Hinweis sofort aus. Dies ist
      eine HA-Diagnose, keine ausgelesene Kesselstörung oder Messung der Heizleistung.


      {% if is_state(''input_boolean.gilles_brennstart_beobachtet'', ''on'') %}Aktueller Zyklus: Starttemperatur
      {{ states(''input_number.gilles_kesseltemperatur_bei_brennstart'') }} °C; Diagnoseminimum {{ states(''input_number.gilles_kesseltemperatur_diagnoseminimum'')
      }} °C.{% else %}Die Temperaturdiagnose wartet auf den nächsten gültig beobachteten Start.{% endif %}


      „40 Messwerte numerisch vorhanden“ prüft vorhandene Zahlenwerte, nicht das Alter der letzten erfolgreichen
      Modbus-Abfrage. Während regulärer Brennläufe erscheinen alle fünf Minuten und bei Phasenwechseln Registerstände
      im Aktivitätenprotokoll für den späteren Touch-Abgleich.'
    type: markdown
  icon: mdi:chart-line
