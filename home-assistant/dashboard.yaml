- cards:
  - content: '## Noch unklare Register


      Bisherige Beobachtungen aus dem Reverse Engineering:


      - **REG[56]**: kurzer Ausschlag beim Übergang Heizen → Ausbrennen.

      - **REG[68]**: steigt während der Heizphase; Bedeutung offen.

      - **REG[72]**: wechselt während eines Brennzyklus; Bedeutung offen.

      - **REG[70, 74, 76]**: bisher 0; Funktion nicht belegt.


      Für die nächste Auswertung die Rohwerte mit Phasencode, Statuscode und dem Touch-Display vergleichen.'
    type: markdown
  - entities:
    - entity: sensor.gilles_reg56
    hours_to_show: 24
    title: REG[56] - kurzer Spike bei Heizen→Ausbrennen
    type: history-graph
  - entities:
    - entity: sensor.gilles_zaehler
    hours_to_show: 24
    title: REG[68] Zähler - steigt in Heizphase
    type: history-graph
  - entities:
    - entity: sensor.gilles_binarflag
    hours_to_show: 24
    title: REG[72] BinarFlag - toggelt während Brennzyklus
    type: history-graph
  - entities:
    - entity: sensor.gilles_reg70
    - entity: sensor.gilles_reg74
    - entity: sensor.gilles_reg76
    hours_to_show: 24
    title: REG[70, 74, 76] – bisher 0
    type: history-graph
