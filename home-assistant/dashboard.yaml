  - content: Die Startdiagnose gilt nur für direkt beobachtete Starts von 0 auf 1. Neustart oder Datenlücke verwerfen die
      laufende Diagnose. Die Startphase schließt Vorlüften ein; der Temperaturvergleich erfolgt ab 30 Minuten im Anbrenn-
      oder Heizbetrieb. Ein Hinweis ist eine Aufforderung zur Prüfung, keine bestätigte Kesselstörung. Während regulärer Brennläufe
      erscheinen alle fünf Minuten und bei Phasenwechseln Registerstände im Aktivitätenprotokoll für den späteren Touch-Abgleich.
    type: markdown
