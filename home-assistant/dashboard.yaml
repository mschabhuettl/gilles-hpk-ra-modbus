- cards:
  - content: '## Erfasster Betrieb


      Start- und Signalzähler erfassen direkt beobachtete Wechsel seit ihrer Einrichtung. Messlücken werden
      nicht aufgefüllt.


      **Brennstarts 24 h:** Gezählt werden die in den letzten 24 Stunden aufgezeichneten direkten Phasenwechsel
      von Standby (0) zu Vorlüften (1). Aktualisierung etwa alle 30 Sekunden. Neustarts und Wiederverbindungen
      ohne beobachteten Übergang zählen nicht als Start. Tageszähler ordnen einen Start dem Starttag zu, auch
      wenn der Zyklus über Mitternacht läuft.


      Die bisherigen Aschezähler zählen REG78-Einschaltflanken; eine tatsächliche Ascheaustragung ist damit
      nicht bestätigt. Das O₂-Minimum berücksichtigt nur gültige Messwerte aus der Heizphase (Code 7). Standbywerte
      werden ausgelassen. Die neue Auswertung beginnt mit den nächsten Heizdaten; frühere Rohwerte werden nicht
      rückwirkend umgerechnet. Nach 24 Stunden ohne Heizmesswert wird kein Minimum mehr angezeigt. Pelletverbrauch
      und Wirkungsgrad bleiben ohne eigene Messung unbekannt.'
    type: markdown
