    - entity: sensor.gilles_brennstarts_monat
      name: Dieser Monat
    - entity: sensor.gilles_brennstarts_erfasst
      name: Gesamt seit Einrichtung
    show_header_toggle: false
    title: Brennstarts · direkt beobachtet
    type: entities
